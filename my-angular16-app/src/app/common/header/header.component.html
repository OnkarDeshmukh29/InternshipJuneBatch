<header class="header">
  <div class="container">
    <a routerLink="/" class="logo">
      <span class="logo-icon">✨</span>
      <span class="logo-text">MyApp</span>
    </a>
    
    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a>
      <a routerLink="/contact-us" routerLinkActive="active" class="nav-link">Contact</a>
      <a routerLink="/user" routerLinkActive="active" class="nav-link">Users</a>
    </nav>
    
    <div class="actions">
      <a *ngIf="!authService.isLoggedIn()" routerLink="/accounts/login" class="btn btn-primary">Login / Register</a>
      <button *ngIf="authService.isLoggedIn()" (click)="onLogout()" class="btn btn-primary" style="background: #e74c3c;">Logout</button>
    </div>
  </div>
</header>
