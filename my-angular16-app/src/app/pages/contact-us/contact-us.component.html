<div class="contact-container" style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
  
  <div class="header-section form-header" style="text-align: center; margin-bottom: 40px;">
    <h2>Contact Us</h2>
    <p>How can we help you today? Fill out the form below.</p>
  </div>

  <div class="form-card" style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
    <form [formGroup]="reactiveForm" (ngSubmit)="onSubmitReactive()">
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="r-name" style="display: block; margin-bottom: 8px; font-weight: 500;">Your Name</label>
        <input type="text" id="r-name" formControlName="name" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
        <div class="error" *ngIf="reactiveForm.get('name')?.invalid && (reactiveForm.get('name')?.dirty || reactiveForm.get('name')?.touched)" style="color: #dc3545; font-size: 0.85rem; margin-top: 5px;">Name is required.</div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="r-email" style="display: block; margin-bottom: 8px; font-weight: 500;">Email Address</label>
        <input type="email" id="r-email" formControlName="email" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
        <div class="error" *ngIf="reactiveForm.get('email')?.invalid && (reactiveForm.get('email')?.dirty || reactiveForm.get('email')?.touched)" style="color: #dc3545; font-size: 0.85rem; margin-top: 5px;">Valid email is required.</div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="r-subject" style="display: block; margin-bottom: 8px; font-weight: 500;">Subject</label>
        <input type="text" id="r-subject" formControlName="subject" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
        <div class="error" *ngIf="reactiveForm.get('subject')?.invalid && (reactiveForm.get('subject')?.dirty || reactiveForm.get('subject')?.touched)" style="color: #dc3545; font-size: 0.85rem; margin-top: 5px;">Subject is required.</div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="r-message" style="display: block; margin-bottom: 8px; font-weight: 500;">Message</label>
        <textarea id="r-message" formControlName="message" rows="5" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; resize: vertical;"></textarea>
        <div class="error" *ngIf="reactiveForm.get('message')?.invalid && (reactiveForm.get('message')?.dirty || reactiveForm.get('message')?.touched)" style="color: #dc3545; font-size: 0.85rem; margin-top: 5px;">Message must be at least 10 characters.</div>
      </div>

      <div class="form-group" style="margin-bottom: 30px;">
        <label for="r-attachment" style="display: block; margin-bottom: 8px; font-weight: 500;">Attachment (Optional)</label>
        <input type="file" id="r-attachment" (change)="onFileSelected($event)" class="form-control" style="width: 100%; padding: 10px; border: 1px dashed #ddd; border-radius: 6px; background: #fafafa;">
      </div>

      <div class="alert success" *ngIf="reactiveSuccess" style="background: #d4edda; color: #155724; padding: 15px; border-radius: 6px; margin-bottom: 20px;">{{ reactiveSuccess }}</div>
      <div class="alert error" *ngIf="reactiveError" style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 6px; margin-bottom: 20px;">{{ reactiveError }}</div>

      <button type="submit" class="btn btn-primary" [disabled]="reactiveForm.invalid || isReactiveSubmitting" style="width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer;">
        {{ isReactiveSubmitting ? 'Sending Message...' : 'Send Message' }}
      </button>
    </form>
  </div>

</div>
